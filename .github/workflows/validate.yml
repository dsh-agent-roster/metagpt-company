name: validate

on:
  push:
  pull_request:

jobs:
  roster:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: validate rosters
        run: npx --yes @stofone/dsh-agent-roster@^0.10.3 validate --dir .
      - name: validate registry
        run: npx --yes @stofone/dsh-agent-roster@^0.10.3 registry validate --file registry.json
      - name: compiled artifacts are in sync with their sources
        run: |
          npx --yes @stofone/dsh-agent-roster@^0.10.3 compile --roster rosters/metagpt-company --write
          git diff --exit-code dist/
