kind: "dsh-agent-roster/roster@2"
id: "metagpt-company"
version: "1.0.0"
title: "MetaGPT 软件公司（迁移）"
description: "把 MetaGPT（MIT）的软件公司角色迁成档案：产品经理、架构师、项目经理、工程师，字段取自上游 Role 的 profile/goal/constraints。"
license: "MIT"
maintainers:
  - "STofone"
tags:
  - "software-company"
  - "sdlc"
  - "metagpt"
captain:
  role: "metagpt-company-project-manager@1.0.0"
handover:
  - title: "上游改版后重新对照 Role 的 profile/goal/constraints"
    detail: "这四个角色的正文是从上游类属性逐字搬来的；上游一改，档案就旧了。"
    verify: "diff 上游 metagpt/roles/*.py 与对应 AGENT.md 的正文段落"
  - title: "换代时确认派活入口仍是 project-manager"
    detail: "上游的编排在 runtime，不在档案；这里只有角色，没有流水线。"
    verify: "新会话首条消息把派活规则写在 project-manager 名下"
targets:
  - "agent-teams/members"
members:
  - as: "product-manager"
    role: "metagpt-company-product-manager@1.0.0"
  - as: "architect"
    role: "metagpt-company-architect@1.0.0"
  - as: "project-manager"
    role: "metagpt-company-project-manager@1.0.0"
  - as: "engineer"
    role: "metagpt-company-engineer@1.0.0"
